<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT Vocab Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        /* Add Japanese font support */
        body {
            font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
        }

        .kanji-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            margin: 20px 0;
        }

        .yomi-text {
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--accent);
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <div class="main-layout">
        <div class="app-container">
            <header>
                <div class="logo">JLPT Quiz</div>
                <div id="progress-container" class="hidden"
                    style="display: flex; align-items: center; gap: 10px; width: 150px;">
                    <span id="progress-text">1 / 5</span>
                    <div class="progress-bar">
                        <div id="progress-fill"></div>
                    </div>
                </div>
            </header>

            <!-- Start View -->
            <section id="view-start" class="view active">
                <div class="hero-card">
                    <h1>JLPT<br>Vocab Master</h1>
                    <p>일본어 능력 시험(JLPT) 필수 단어<br>4지선다 퀴즈로 완벽 대비!</p>
                    <div class="stats-preview">
                        <div class="stat-item">
                            <span class="label">Total Words</span>
                            <span class="value" id="total-db-count">0</span>
                        </div>
                    </div>
                    <button id="btn-start" class="btn-primary">퀴즈 시작하기</button>
                    <!-- Future feature: settings or level select -->
                </div>
            </section>

            <!-- Quiz View -->
            <section id="view-quiz" class="view hidden">
                <div class="card quiz-card">
                    <div class="question-type">Meaning Check</div>

                    <!-- Question Area -->
                    <div id="question-area">
                        <div class="kanji-text" id="question-kanji">漢字</div>
                        <!-- Optional: Hit button to show reading? User said 'Question: Kanji', 'Options: Meaning' -->
                    </div>

                    <!-- Options Area -->
                    <div class="options-grid" id="options-container">
                        <button class="btn-choice" data-idx="0">
                            <span class="choice-label">A</span>
                            <span class="choice-text">Option A</span>
                        </button>
                        <button class="btn-choice" data-idx="1">
                            <span class="choice-label">B</span>
                            <span class="choice-text">Option B</span>
                        </button>
                        <button class="btn-choice" data-idx="2">
                            <span class="choice-label">C</span>
                            <span class="choice-text">Option C</span>
                        </button>
                        <button class="btn-choice" data-idx="3">
                            <span class="choice-label">D</span>
                            <span class="choice-text">Option D</span>
                        </button>
                    </div>

                    <button id="btn-stop" class="btn-secondary small">그만 풀기 (Exit)</button>
                </div>
            </section>

            <!-- Report View -->
            <section id="view-report" class="view hidden">
                <div class="card report-card">
                    <h2>Quiz Result</h2>
                    <div class="score-circle">
                        <svg viewBox="0 0 36 36" class="circular-chart blue">
                            <path class="circle-bg"
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle" id="score-circle-path" stroke-dasharray="0, 100"
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="20.35" class="percentage" id="score-text">0%</text>
                        </svg>
                    </div>
                    <div class="report-details">
                        <p>정답: <span id="correct-count" class="highlight-green">0</span> / 틀림: <span id="wrong-count"
                                class="highlight-red">0</span></p>
                    </div>
                    <div id="wrong-answers-section" class="hidden wrong-section-scroll">
                        <h3>오답 노트</h3>
                        <ul id="wrong-items-list"></ul>
                    </div>
                    <button id="btn-restart" class="btn-primary">다시 시작하기</button>
                </div>
            </section>
        </div>

        <!-- Feedback Modal -->
        <div id="feedback-modal" class="modal hidden">
            <div class="modal-content feedback-content">
                <div id="feedback-icon" class="icon">✅</div>
                <h3 id="feedback-title">정답입니다!</h3>

                <div
                    style="margin: 20px 0; text-align: left; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px;">
                    <p style="margin: 5px 0; color: #fff; font-size: 1.5rem; font-weight: bold; font-family: 'Noto Sans JP'"
                        id="fb-kanji">漢字</p>
                    <p style="margin: 5px 0; color: var(--accent); font-family: 'Noto Sans JP'" id="fb-reading">かんじ</p>
                    <p style="margin: 5px 0; color: #ccc;" id="fb-meaning">Meaning</p>
                    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;">
                    <p style="margin: 5px 0; color: #aaa; font-style: italic; font-size: 0.9rem;" id="fb-example">
                        Example Sentence</p>
                </div>

                <button id="btn-next" class="btn-primary">다음 문제</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
